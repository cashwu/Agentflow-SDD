# Agentflow SDD Configuration
workflow: agentflow-sdd
version: "3.0"

locale: zh-TW

directories:
  changes: agentflow/changes
  archive: agentflow/changes/archive
  master_specs: openspec/specs

artifacts:
  - id: proposal
    file: proposal.md
    created_by: step-4-spec
    dependencies: []
  - id: design
    file: design.md
    created_by: step-4-spec
    updated_by: [step-5-usage]
    dependencies: [proposal]
  - id: spec
    file: spec.md
    created_by: step-4-spec
    updated_by: [step-5-usage]
    dependencies: [proposal]
  - id: tasks
    file: tasks.md
    created_by: step-6-ticket
    updated_by: [step-7-dev]
    dependencies: [proposal, design, spec]

preferences:
  tdd: false
  parallel_tasks: false
  audit: false

context: |
  This project uses a self-contained Agentflow-SDD workflow.
  For non-trivial changes, use the 9-step sdd-* Agentflow wrappers.
  The 9 steps are Discuss, Explore, Prototype, Spec, Usage, Ticket, Dev,
  Review, and Wrap.
  Each step must produce a supporting markdown document under
  agentflow/changes/<change>/agentflow/ so the decision trail survives
  handoff and parked changes.
  Every step must run its own review/rating/fix loop before the next step
  starts. Passing means quality_score > 9/10 and no critical gap.
  Every review and rating must be delegated to a fresh, independent sub-agent.
  Each round must use a different sub-agent — never review inline in the main
  agent context and never reuse a prior round's sub-agent.

rules:
  proposal:
    - Capture the Discuss outcome: goals, non-goals, assumptions, open questions, and concrete acceptance examples when available.
    - Include Explore findings for non-trivial changes.
    - If a prototype or spike was run, state the learning. If skipped, state why risk is low enough.
    - Keep scope boundaries explicit. Do not let nice-to-have work enter the change silently.
    - Preserve per-step review/rating/fix decisions from Agentflow support documents when they affect scope or requirements.
    - Do not collapse review/rating/fix activity into a single summary only. Preserve dedicated review round files under agentflow/reviews/.
  design:
    - Include Explore Findings for material risks and the decision each risk drove.
    - Include Prototype Findings when a spike was run or intentionally skipped. If skipped, name why the risk is low enough.
    - Include a Working Backwards Usage/API Contract that describes the future user-facing behavior, command/API shape, input/output, errors, and privacy expectations before code exists.
    - Include an Implementation Contract for each implementation area: observable behavior, data shape, failure modes, acceptance criteria, verification target, and out-of-scope items.
    - Avoid line-number-coupled instructions. Name modules, functions, commands, behavior, and contracts instead.
  specs:
    - Use normative SHALL/MUST language in English and include scenario examples that can become tests.
    - Every user-visible behavior, privacy boundary, and failure mode introduced by the proposal needs a testable requirement.
    - Do not invent requirements not present in Discuss, Explore, Prototype, or explicit user direction.
  tasks:
    - Every task must name an observable outcome and a concrete verification target such as a test, command, analyzer check, or manual assertion.
    - Tasks must be small enough for one focused implementation pass and must not rely on vague phrases such as "handle edge cases" without naming the cases.
    - Mark independent tasks with [P] only when they can run in parallel without depending on unfinished tasks or overlapping the same code region.
    - Include tasks or subtasks to update required Agentflow step documents when implementation changes the decision trail.
    - Include tasks or subtasks to update required Agentflow review round documents when implementation changes review evidence or decisions.
    - Do not mark an implementation task complete until its own review/rating/fix loop passes with quality_score > 9/10 and no critical gap. Each review/rating round must use a fresh sub-agent.
    - Do not mark an implementation task complete until its review round files exist under agentflow/reviews/ using 07-dev-task-<task-id>-r<round>.md naming.
    - Add a final review task that compares implementation against specs, design contracts, tests, and verification targets before wrap.
